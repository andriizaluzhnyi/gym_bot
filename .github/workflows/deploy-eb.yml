name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - master
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/project/gymbro
            # Manual edits to tracked files on the server would block the
            # pull — set them aside (recoverable via `git stash list`)
            # instead of failing the deploy. Untracked files (.env) are
            # not touched.
            if ! git diff --quiet || ! git diff --cached --quiet; then
              git stash push -m "deploy-autostash $(date -u +%Y%m%dT%H%M%SZ)"
            fi
            git fetch origin master
            git reset --hard origin/master
            docker compose up -d --build
            docker image prune -f
